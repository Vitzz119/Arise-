<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Smart Drowsiness Bracelet — Prototype UI/UX</title>
<style>
:root{
  color-scheme:light;
  --bg:#E6ECF2; --frame:#18242F; --surface:#FFFFFF; --surface2:#F3F6F9;
  --ink:#12202B; --ink2:#586A7A; --line:#DDE4EB;
  --pulse:#E5465C; --pulse-soft:#FCE4E8;
  --ai:#5848E3; --ai-soft:#ECE9FE; --on-ai:#FFFFFF;
  --ok:#0B9484; --ok-soft:#DCF3EF;
  --warn:#B86E08; --warn-soft:#FBEED6;
}
@media (prefers-color-scheme:dark){
  :root{
    color-scheme:dark;
    --bg:#090E13; --frame:#33465A; --surface:#16202A; --surface2:#0F171E;
    --ink:#EAF0F5; --ink2:#93A5B6; --line:#263543;
    --pulse:#FF6F82; --pulse-soft:#3A1D25;
    --ai:#A094FF; --ai-soft:#262250; --on-ai:#14112B;
    --ok:#3FD0BC; --ok-soft:#133330;
    --warn:#F1B14D; --warn-soft:#3A2A0E;
  }
}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:ui-rounded,"SF Pro Rounded","Segoe UI Variable","Segoe UI",system-ui,sans-serif;font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--ai);outline-offset:2px}
.stage{min-height:100dvh;display:flex;align-items:center;justify-content:center}
.app{position:relative;width:100%;height:100dvh;background:var(--surface2);display:flex;flex-direction:column;overflow:hidden}
@media (min-width:520px){
  .stage{padding:24px}
  .app{width:390px;height:min(812px,calc(100dvh - 48px));border-radius:40px;border:9px solid var(--frame);box-shadow:0 28px 70px rgba(10,20,30,.28)}
}

/* App bar */
.bar{display:flex;align-items:center;gap:4px;padding:8px 12px 6px 8px;padding-top:max(8px,env(safe-area-inset-top))}
.bar h1{flex:1;font-size:19px;font-weight:700;letter-spacing:-.01em}
.status{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--ink2)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--ink2);opacity:.5}
.dot.on{background:var(--ok);opacity:1}
.icon-btn{width:44px;height:44px;border-radius:14px;border:0;background:transparent;color:var(--ink);display:grid;place-items:center}
.icon-btn.sm{width:36px;height:36px;color:var(--ink2);flex:none}
.ic{flex:none}

/* Screen */
.screen{flex:1;overflow-y:auto;padding:10px 16px 100px;display:flex;flex-direction:column;gap:12px;scrollbar-width:none}
.screen::-webkit-scrollbar{display:none}
.screen>*{flex:none}
.screen.chatmode{padding:0;overflow:hidden;gap:0}
.grow{flex:1;min-width:0}
h2{font-size:16px;font-weight:700}
small,.hint{color:var(--ink2);font-size:13px}
.hint{line-height:1.4}
.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:12px}
.empty{color:var(--ink2);text-align:center;padding:24px 12px;list-style:none}

/* Buttons */
.btn{height:46px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);padding:0 16px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.sm{height:38px;padding:0 14px;font-size:14px;border-radius:12px}
.btn.ai{background:var(--ai);color:var(--on-ai);border-color:transparent}
.btn.dark{background:var(--ink);color:var(--surface);border-color:transparent}
.btn:disabled{opacity:.55;cursor:default}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btns .btn{flex:1}

/* Pills + tags */
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:999px;font-size:12.5px;font-weight:700}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.high{background:var(--pulse-soft);color:var(--pulse)}
.pill.off{background:var(--line);color:var(--ink2)}
.tag{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:700}
.tag.kesehatan{background:var(--ok-soft);color:var(--ok)}
.tag.pekerjaan{background:var(--warn-soft);color:var(--warn)}
.tag.ai{background:var(--ai-soft);color:var(--ai)}

/* Home hero */
.hero{background:var(--surface);border:1px solid var(--line);border-radius:30px;padding-top:18px;overflow:hidden}
.hero-top{display:flex;align-items:center;justify-content:space-between;padding:0 18px}
.lbl{font-size:14px;font-weight:700;color:var(--ink2);display:flex;align-items:center;gap:8px}
.live{width:9px;height:9px;border-radius:50%;background:var(--pulse);animation:beat 1.1s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1);opacity:1}40%{transform:scale(1.5);opacity:.6}}
.big{display:flex;align-items:baseline;gap:8px;padding:6px 18px 0;font-variant-numeric:tabular-nums}
.big .n{font-size:76px;font-weight:700;letter-spacing:-.04em;line-height:1}
.big .u{font-size:17px;font-weight:700;color:var(--ink2)}
.hero-sub{padding:4px 18px 0;color:var(--ink2);font-size:13.5px}
#ecg{display:block;width:100%;height:96px;margin-top:8px;-webkit-mask-image:linear-gradient(90deg,transparent,#000 38%);mask-image:linear-gradient(90deg,transparent,#000 38%)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.tile .ti{display:flex;align-items:center;gap:6px;color:var(--ink2);font-size:13px;font-weight:600}
.tile .v{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.aicard{background:var(--ai-soft);border-radius:24px;padding:16px;display:flex;flex-direction:column;gap:10px}
.ai-h{display:flex;align-items:center;gap:7px;color:var(--ai);font-weight:700;font-size:14px}
.aitext{font-size:15px;line-height:1.5}
.next{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;align-items:center;gap:14px}
.next .tm{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em}

/* Chart */
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface);border:1px solid var(--line);border-radius:15px;padding:3px}
.seg button{height:38px;border:0;border-radius:12px;background:transparent;color:var(--ink2);font-weight:700}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--surface)}
.readout{display:flex;align-items:baseline;gap:6px;font-variant-numeric:tabular-nums}
.readout b{font-size:34px;letter-spacing:-.02em}
.readout span{color:var(--ink2);font-size:14px;margin-left:4px}
#chartbox{touch-action:pan-y;cursor:crosshair;border-radius:12px}
#chart{display:block;width:100%;height:auto}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stats .tile{padding:10px 12px}

/* Chips + lists */
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{height:36px;padding:0 15px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-size:14px;font-weight:700;white-space:nowrap}
.chip[aria-pressed=true]{background:var(--ink);color:var(--surface);border-color:transparent}
.list{list-style:none;padding:0;display:flex;flex-direction:column;gap:8px}
.row{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;align-items:center;gap:12px}
.ico{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;flex:none}
.ico.high{background:var(--pulse-soft);color:var(--pulse)}
.ico.warn{background:var(--warn-soft);color:var(--warn)}
.ico.ok{background:var(--ok-soft);color:var(--ok)}
.ico.ai{background:var(--ai-soft);color:var(--ai)}

/* Schedule */
.sch .t{font-weight:700;line-height:1.3}
.sch .time{font-variant-numeric:tabular-nums;color:var(--ink2);margin-right:8px;font-weight:700}
.sch .tags{display:flex;gap:6px;margin-top:5px;flex-wrap:wrap}
.sch.done .t{text-decoration:line-through;opacity:.5}
.chk{width:28px;height:28px;border-radius:9px;border:2px solid var(--line);background:transparent;display:grid;place-items:center;flex:none;color:var(--on-ai)}
.chk[aria-pressed=true]{background:var(--ok);border-color:var(--ok)}
.vib{display:flex;flex-direction:column;align-items:center;gap:2px;flex:none}
.vib small{font-size:11px;font-weight:600}
.sw{width:44px;height:26px;border-radius:999px;border:0;background:var(--line);position:relative;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s}
.sw[aria-checked=true]{background:var(--ok)}
.sw[aria-checked=true]::after{transform:translateX(18px)}
.sug{display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:16px;padding:10px 12px}
.sug p{font-size:13px;color:var(--ink2);margin-top:2px;line-height:1.35}

/* Alerts */
.acard{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.arow{width:100%;display:flex;align-items:center;gap:12px;padding:12px;border:0;background:transparent;text-align:left}
.arow b{display:flex;align-items:center;gap:6px}
.arow small{display:block;line-height:1.3;margin-top:1px}
.when{font-size:12.5px;color:var(--ink2);font-weight:600;align-self:flex-start;white-space:nowrap}
.unread{width:8px;height:8px;border-radius:50%;background:var(--pulse);display:inline-block}
.why{background:var(--ai-soft);margin:0 10px 10px;border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px}
.why p{font-size:14px;line-height:1.5}
.rng{display:grid;grid-template-columns:1fr auto;gap:6px 8px;align-items:center;font-weight:600}
.rng input{grid-column:1/-1;width:100%;accent-color:var(--ai);height:28px}

/* Connection */
.band{flex-direction:row;align-items:center;gap:16px}
.bandart svg{display:block}
.bandart.shake{animation:shake .5s}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-4px) rotate(-2deg)}40%{transform:translateX(4px) rotate(2deg)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}
.batt{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin:8px 0 4px}
.batt i{display:block;height:100%;background:var(--ok)}
.dev{display:flex;align-items:center;gap:12px}

/* History */
.dayh{font-size:13px;font-weight:700;color:var(--ink2);margin:6px 2px 0}
.hrow .tx{font-size:14.5px;line-height:1.35}
.hrow small{display:block;margin-top:1px}

/* Chat */
.chat{display:flex;flex-direction:column;height:100%}
.msgs{flex:1;overflow-y:auto;padding:12px 16px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:88%;padding:10px 14px;border-radius:20px;font-size:15px;line-height:1.5}
.msg.ai{background:var(--ai-soft);align-self:flex-start;border-bottom-left-radius:6px}
.msg.me{background:var(--ink);color:var(--surface);align-self:flex-end;border-bottom-right-radius:6px}
.typing{display:flex;gap:4px;padding:14px 16px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--ai);animation:blink 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes blink{0%,100%{opacity:.25}50%{opacity:1}}
.quick{display:flex;gap:8px;overflow-x:auto;padding:6px 16px 10px;scrollbar-width:none}
.quick::-webkit-scrollbar{display:none}
.composer{display:flex;gap:8px;padding:10px 12px 4px;border-top:1px solid var(--line);background:var(--surface)}
.in{height:48px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface2);color:var(--ink);padding:0 14px;font:inherit;font-size:16px;width:100%;min-width:0}
.send{width:48px;padding:0;flex:none}
.disc{font-size:12px;color:var(--ink2);text-align:center;padding:2px 12px 10px;background:var(--surface)}

/* FAB */
.fab{position:absolute;right:16px;bottom:18px;height:54px;padding:0 20px 0 16px;border-radius:27px;border:0;background:var(--ai);color:var(--on-ai);display:flex;align-items:center;gap:8px;font-weight:700;box-shadow:0 10px 24px rgba(88,72,227,.38);z-index:10}

/* Drawer = layar opsi */
.scrim{position:absolute;inset:0;background:rgba(8,14,20,.5);opacity:0;pointer-events:none;transition:opacity .25s;z-index:20}
.drawer{position:absolute;top:0;bottom:0;left:0;width:86%;max-width:322px;background:var(--surface);z-index:21;transform:translateX(-102%);visibility:hidden;transition:transform .26s cubic-bezier(.3,.8,.3,1),visibility 0s .26s;display:flex;flex-direction:column;gap:8px;padding:18px 14px;padding-top:max(18px,env(safe-area-inset-top));overflow-y:auto}
.app.open .scrim{opacity:1;pointer-events:auto}
.app.open .drawer{transform:none;visibility:visible;transition:transform .26s cubic-bezier(.3,.8,.3,1),visibility 0s}
.d-head{display:flex;align-items:center;gap:12px;padding:4px 6px 14px;margin-bottom:6px;border-bottom:1.5px solid var(--line)}
.logo{width:46px;height:46px;border-radius:15px;background:var(--ink);color:var(--surface);display:grid;place-items:center;flex:none}
.d-head b{font-size:18px;display:block;letter-spacing:-.01em}
.d-head small{display:flex;align-items:center;gap:6px}
.nav{display:flex;align-items:center;gap:12px;height:50px;padding:0 14px;border-radius:17px;border:1.5px solid var(--line);background:transparent;font-weight:700;width:100%;text-align:left;flex:none}
.nav[aria-current=page]{background:var(--ink);color:var(--surface);border-color:transparent}
.badge{margin-left:auto;min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:var(--pulse);color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center}
.d-sec{margin:14px 6px 2px;font-size:13px;font-weight:700;color:var(--ink2)}
.d-row{display:flex;align-items:center;gap:8px;padding:8px 6px;border-bottom:1px solid var(--line);font-size:14px}
.d-row span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.d-row small{flex:none}

/* Sheet + toast */
.sheet-wrap{position:absolute;inset:0;z-index:30;display:none;align-items:flex-end;background:rgba(8,14,20,.5)}
.sheet-wrap.open{display:flex}
.sheet{width:100%;background:var(--surface);border-radius:28px 28px 0 0;padding:18px 16px 22px;display:flex;flex-direction:column;gap:12px}
.field{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:14px}
.toast{position:absolute;left:16px;right:16px;bottom:86px;background:var(--ink);color:var(--surface);border-radius:14px;padding:12px 14px;display:flex;align-items:center;gap:12px;font-size:14px;font-weight:600;transform:translateY(16px);opacity:0;pointer-events:none;transition:transform .22s,opacity .22s;z-index:40}
.toast.show{transform:none;opacity:1;pointer-events:auto}
.toast button{margin-left:auto;background:none;border:0;text-decoration:underline;font-weight:700}

@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<div class="stage">
  <div class="app" id="app">
    <header class="bar">
      <button class="icon-btn" data-act="drawer" aria-label="Buka layar opsi" id="menuBtn"></button>
      <h1 id="title">Smart Bracelet</h1>
      <div class="status" id="status"></div>
    </header>
    <main class="screen" id="screen"></main>
    <button class="fab" id="fab" data-act="ai" aria-label="Buka asisten AI"></button>
    <div class="scrim" data-act="drawer-close"></div>
    <aside class="drawer" id="drawer" aria-label="Layar opsi"></aside>
    <div class="sheet-wrap" id="sheet" data-act="sheet-bg"></div>
    <div class="toast" id="toast" role="status"></div>
  </div>
</div>

<script>
/* ---------- Smart Drowsiness Bracelet: dashboard logic ---------- */
const $=(s,r=document)=>r.querySelector(s);
const app=$('#app');
const pad=n=>String(n).padStart(2,'0');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=s=>esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\n/g,'<br>');
const avg=a=>a.length?Math.round(a.reduce((x,y)=>x+y,0)/a.length):null;
const nowLabel=()=>{const d=new Date();return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`};
const ICONS={
 menu:'<path d="M4 7h16M4 12h16M4 17h10"/>',home:'<path d="M4 11l8-7 8 7"/><path d="M6 10v9h12v-9"/>',chart:'<path d="M4 19V5"/><path d="M4 19h16"/><path d="M7 14l4-4 3 3 5-6"/>',calendar:'<rect x="4" y="5" width="16" height="15" rx="3"/><path d="M4 10h16M9 3v4M15 3v4"/>',bell:'<path d="M6 17v-6a6 6 0 0112 0v6l1.5 2h-15z"/><path d="M10 21h4"/>',wifi:'<path d="M2 9a15 15 0 0120 0"/><path d="M5 12.5a10 10 0 0114 0"/><path d="M8.5 16a5 5 0 017 0"/><path d="M12 19.5h.01"/>',history:'<path d="M4 12a8 8 0 108-8 8 8 0 00-6 2.7L4 9"/><path d="M4 4v5h5"/><path d="M12 8v4l3 2"/>',spark:'<path d="M11 3l1.9 5.1L18 10l-5.1 1.9L11 17l-1.9-5.1L4 10l5.1-1.9z"/><path d="M18 16l.7 2 2 .7-2 .7-.7 2-.7-2-2-.7 2-.7z"/>',heart:'<path d="M12 20s-7-4.4-7-10a4 4 0 017-2.6A4 4 0 0119 10c0 5.6-7 10-7 10z"/>',plus:'<path d="M12 5v14M5 12h14"/>',trash:'<path d="M5 7h14M10 7V4h4v3M7 7l1 13h8l1-13"/>',send:'<path d="M4 12l16-8-6 16-3-7z"/>',close:'<path d="M6 6l12 12M18 6L6 18"/>',check:'<path d="M5 12.5l4.5 4.5L19 7.5"/>',vibrate:'<rect x="8" y="4" width="8" height="16" rx="2"/><path d="M4 8v8M20 8v8"/>',drop:'<path d="M12 3s6 6.2 6 10.5A6 6 0 016 13.5C6 9.2 12 3 12 3z"/>',walk:'<circle cx="13" cy="5" r="2"/><path d="M10 21l2-6-2-3 1-4 4 2 2 3M9 12l-3 2"/>',thermo:'<path d="M10 14V5a2 2 0 014 0v9a4 4 0 11-4 0z"/>',moon:'<path d="M20 14.5A8 8 0 019.5 4 8 8 0 1020 14.5z"/>',battery:'<rect x="3" y="8" width="16" height="8" rx="2"/><path d="M21 11v2"/>',refresh:'<path d="M20 11a8 8 0 00-14-4L4 9"/><path d="M4 4v5h5"/><path d="M4 13a8 8 0 0014 4l2-2"/><path d="M20 20v-5h-5"/>',band:'<rect x="9" y="2" width="6" height="20" rx="3"/><rect x="6" y="7" width="12" height="10" rx="4"/>'
};
const ic=(n,s=20)=>`<svg class="ic" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[n]||ICONS.spark}</svg>`;
const NAV=[['home','Home','home'],['chart','Grafik sensor','chart'],['analysis','Analisis','spark'],['alerts','Peringatan','bell'],['connect','Koneksi','wifi'],['history','Riwayat','history']];
const TITLES={home:'Smart Bracelet',chart:'Grafik sensor',analysis:'Analisis pola',alerts:'Peringatan',connect:'Koneksi',history:'Riwayat',ai:'Asisten AI'};
const S={screen:'home',simulation:true,connected:false,device:'SDB-ESP32-01',hr:74,edaRaw:1800,edaBase:1750,edaChange:2.9,valid:true,status:0,stamp:nowLabel(),samples:[],alerts:[],history:[],expanded:null,range:'day',metric:'hr',sel:0,chat:[{role:'ai',text:'Halo! Aku asisten Smart Drowsiness Bracelet. Aku membantu menjelaskan data denyut nadi dan perubahan EDA/GSR sebagai indikator awal. Sistem ini bukan alat diagnosis dan belum menggunakan model AI terlatih.'}],aiBusy:false,scanning:false,found:[],lastSync:'belum ada data perangkat',confirm:0,normalConfirm:0};
const statusInfo={0:{label:'AMAN',cls:'ok'},1:{label:'WASPADA',cls:'warn'},2:{label:'BAHAYA',cls:'high'},3:{label:'DATA TIDAK TERSEDIA',cls:'off'}};
function addHistory(type,text){S.history.unshift({id:Date.now()+Math.random(),time:nowLabel(),day:'Hari ini',type,text,source:S.simulation?'SIMULASI':(S.valid?'PERANGKAT':'OFFLINE')});S.history=S.history.slice(0,100)}
function recordSample(){if(!S.valid)return;S.samples.push({time:nowLabel(),hr:S.hr,eda:S.edaRaw,change:S.edaChange,status:S.status,source:S.simulation?'SIMULASI':(S.valid?'PERANGKAT':'OFFLINE')});if(S.samples.length>120)S.samples.shift()}
function computeStatus(){
 if(!S.valid||S.hr==null||S.edaChange==null){S.status=3;return}
 // Thresholds are prototype experiment settings, not medical criteria.
 const danger=(S.hr<60 && S.edaChange>=10)||(S.hr<=55)||(S.edaChange>=18);

async function sendChat(text){text=(text||'').trim();if(!text||S.aiBusy)return;S.chat.push({role:'user',text});S.aiBusy=true;drawMsgs();await new Promise(r=>setTimeout(r,180));S.chat.push({role:'ai',text:localAI(text)});S.aiBusy=false;drawMsgs()}
function drawMsgs(){const box=$('#msgs');if(!box)return;box.innerHTML=S.chat.map(m=>`<div class="msg ${m.role==='ai'?'ai':'me'}">${fmt(m.text)}</div>`).join('')+(S.aiBusy?'<div class="msg ai typing"><i></i><i></i><i></i></div>':'');box.scrollTop=box.scrollHeight}
const ACT={drawer:()=>app.classList.contains('open')?closeDrawer():openDrawer(),'drawer-close':closeDrawer,nav:(t,id)=>go(id),ai:()=>go('ai'),ask:(t)=>{if(S.screen!=='ai')go('ai');sendChat(t.dataset.q)},send:()=>{const q=$('#q'),v=q?.value||'';if(q)q.value='';sendChat(v)},metric:(t,id)=>{S.metric=id;S.sel=Math.max(0,chartVals().length-1);render()},'alert-open':(t,id)=>{S.expanded=S.expanded==id?null:Number(id);render()},'alert-read':(t,id)=>{const a=S.alerts.find(a=>a.id==id);if(a)a.read=true;render()},'alert-ask':(t,id)=>{const a=S.alerts.find(a=>a.id==id);go('ai');sendChat(a?`Jelaskan peringatan ini: ${a.title}. ${a.detail}. ${a.why}`:'Jelaskan peringatan terbaru')},'sim-toggle':()=>{S.simulation=!S.simulation;if(S.simulation){S.valid=true;S.stamp=nowLabel();computeStatus();recordSample();addHistory('sync','Mode simulasi diaktifkan')}else{S.valid=false;S.hr=null;S.edaRaw=null;S.edaChange=null;S.status=3;S.stamp=nowLabel();addHistory('sync','Simulasi dihentikan; data ditandai tidak tersedia')}render();toast(S.simulation?'Mode simulasi aktif':'Simulasi berhenti; data tidak tersedia')},'sensor-invalid':()=>{S.simulation=false;S.valid=false;S.hr=null;S.edaRaw=null;S.edaChange=null;S.status=3;S.stamp=nowLabel();addHistory('alert','Sensor ditandai tidak valid');render();toast('Data tidak valid — tidak dianggap AMAN')},'sensor-valid':()=>{S.simulation=true;S.valid=true;S.hr=74;S.edaRaw=1800;S.edaChange=2.9;S.stamp=nowLabel();S.status=0;S.confirm=0;recordSample();addHistory('sync','Data demo dipulihkan');render();toast('Data simulasi dipulihkan')},export:downloadCSV,'clear-history':()=>{S.history=[];render();toast('Riwayat dibersihkan')},'clear-alerts':()=>{S.alerts=[];render();toast('Peringatan dibersihkan')},'toast-act':()=>{const t=$('#toast');t.classList.remove('show');t._fn&&t._fn()}};
app.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(!t)return;const f=ACT[t.dataset.act];if(f)f(t,t.dataset.id,e)});
app.addEventListener('keydown',e=>{if(e.target.id==='q'&&e.key==='Enter'){e.preventDefault();ACT.send()}if(e.key==='Escape'){closeDrawer()}});
$('#menuBtn').innerHTML=ic('menu',24);$('#fab').innerHTML=ic('spark',22)+'<span>Tanya AI</span>';$('#drawer').inert=true;
S.edaChange=Math.round(((S.edaRaw-S.edaBase)/S.edaBase)*1000)/10;S.status=0;recordSample();addHistory('sync','Prototipe dashboard dibuka; data awal berlabel SIMULASI');
render();setInterval(simulateTick,2500);

</script>
